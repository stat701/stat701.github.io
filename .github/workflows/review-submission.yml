name: Review title and abstract (AI)

on:
  workflow_run:
    workflows:
      - Validate submission
    types:
      - completed

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  # Review runs are infrequent, so one repository-wide queue is preferable to
  # any chance that a manual and automatic run spend credits concurrently.
  group: ai-review-stat701
  queue: max

jobs:
  review:
    name: Advisory AI review
    # workflow_run supplies secrets only after the unprivileged validator has
    # finished. This job never downloads its artifacts or checks out the pull
    # request; it treats the submitted metadata strictly as bounded API data.
    # Registration and the first review use the separate, explicitly manual
    # workflow. This lane handles only later versions from registered owners.
    if: >-
      github.repository == 'stat701/stat701.github.io' &&
      github.event.repository.default_branch == 'main' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted default-branch reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve the validated pull request
        id: pull_request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$HEAD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] \
            || [[ -z "$HEAD_OWNER" ]] \
            || [[ -z "$HEAD_REPOSITORY" ]] \
            || [[ -z "$HEAD_BRANCH" ]]; then
            echo "::error::The validated workflow run has invalid head metadata."
            exit 1
          fi

          # workflow_run payloads do not reliably populate pull_requests.
          # Resolve the one currently open PR by repository owner and branch,
          # then bind it to the exact head commit that passed validation.
          pull_request="$(
            gh api \
              --method GET \
              "/repos/$REPOSITORY/pulls" \
              -f state=open \
              -f base="$DEFAULT_BRANCH" \
              -f head="$HEAD_OWNER:$HEAD_BRANCH" \
              --jq 'if length == 0 then "none" elif length == 1 then [.[0].number, .[0].head.sha, .[0].head.repo.full_name, .[0].base.repo.full_name, .[0].base.ref] | @tsv else "ambiguous" end'
          )"
          if [[ "$pull_request" == "none" ]]; then
            echo "review_eligible=false" >> "$GITHUB_OUTPUT"
            echo "The validated pull request is no longer open; skipping advisory review."
            exit 0
          fi
          if [[ "$pull_request" == "ambiguous" ]]; then
            echo "::error::More than one open pull request matched the validated branch."
            exit 1
          fi
          IFS=$'\t' read -r pr_number resolved_head_sha resolved_head_repository \
            base_repository base_branch <<< "$pull_request"
          if [[ "$resolved_head_sha" != "$HEAD_SHA" ]] \
            || [[ "$resolved_head_repository" != "$HEAD_REPOSITORY" ]] \
            || [[ "$base_repository" != "$REPOSITORY" ]] \
            || [[ "$base_branch" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Could not bind the validated run to one current pull request."
            exit 1
          fi

          if [[ ! "$pr_number" =~ ^[1-9][0-9]{0,7}$ ]]; then
            echo "::error::Could not resolve one validated pull request."
            exit 1
          fi
          echo "review_eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "expected_head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Review the title and abstract
        if: steps.pull_request.outputs.review_eligible == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.pull_request.outputs.expected_head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          PR_NUMBER: ${{ steps.pull_request.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          review_arguments=(
            --repository "$REPOSITORY"
            --pr-number "$PR_NUMBER"
            --default-branch "$DEFAULT_BRANCH"
            --model "${OPENAI_REVIEW_MODEL:-gpt-5.6-terra}"
            --skip-non-metadata
            --expected-head-sha "$EXPECTED_HEAD_SHA"
          )
          python scripts/review_submission.py "${review_arguments[@]}"
