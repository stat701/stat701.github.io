name: Choose slide delivery mode

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  choose:
    if: >-
      github.repository == 'stat701/stat701.github.io' &&
      (
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          (startsWith(github.event.comment.body, '/slides public') ||
          startsWith(github.event.comment.body, '/slides private'))
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          github.event.review.state == 'approved' &&
          github.event.review.user.id == 12053767 &&
          github.event.review.user.type == 'User'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ORG_REPO_ADMIN_TOKEN || github.token }}

      - name: Process the choice
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_ADMIN_TOKEN }}
          FALLBACK_GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ID: ${{ github.event.comment.user.id }}
          COMMENT_AUTHOR_TYPE: ${{ github.event.comment.user.type }}
          ADMIN_TOKEN_AVAILABLE: ${{ secrets.ORG_REPO_ADMIN_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            export GH_TOKEN="$FALLBACK_GITHUB_TOKEN"
          fi
          # `gh repo clone` authenticates through GH_TOKEN, but the nested
          # repository's plain Git remote needs the same credential helper.
          gh auth setup-git
          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            PR_NUMBER="$REVIEW_PR_NUMBER"
          fi
          pr_json="$(gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author_id="$(jq -r '.user.id' <<<"$pr_json")"
          author_login="$(jq -r '.user.login' <<<"$pr_json")"
          author_type="$(jq -r '.user.type' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            # Approval events also fire for PDF PRs. This workflow only
            # configures delivery for an open title-and-abstract PR.
            [[ "$(jq -r '.state' <<<"$pr_json")" == "open" ]] || exit 0
            review_paths=()
            while IFS= read -r filename; do
              review_paths+=("$filename")
            done < <(gh api --paginate "/repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
            if [[ "${#review_paths[@]}" -ne 1 || ! "${review_paths[0]}" =~ ^_talks/(fall-2026-[0-9]{2})\.md$ ]]; then
              echo "Approval is not for a title-and-abstract submission; skipping slide-mode configuration."
              exit 0
            fi
          fi
          mode=public
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if [[ "$COMMENT_AUTHOR_TYPE" != "User" || ( "$COMMENT_AUTHOR_ID" != "$author_id" && "$COMMENT_AUTHOR_ID" != "12053767" ) ]]; then
              gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Slide mode choice rejected: only the registered student or instructor may choose the delivery mode."
              exit 1
            fi
            [[ "$COMMENT_BODY" == "/slides private"* ]] && mode=private
          else
            pr_body="$(jq -r '.body // ""' <<<"$pr_json")"
            public_checked=false
            private_checked=false
            grep --quiet --ignore-case --extended-regexp \
              '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*I choose \*\*public\*\* slide delivery[:.]' \
              <<<"$pr_body" && public_checked=true
            grep --quiet --ignore-case --extended-regexp \
              '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*I choose \*\*private\*\* slide delivery[:.]' \
              <<<"$pr_body" && private_checked=true
            if [[ "$public_checked" == true && "$private_checked" == false ]]; then
              mode=public
            elif [[ "$public_checked" == false && "$private_checked" == true ]]; then
              mode=private
            else
              gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Please check exactly one slide-delivery option in the pull-request checklist: public or private."
              exit 1
            fi
          fi
          if [[ "$mode" == private && "$ADMIN_TOKEN_AVAILABLE" != "true" ]]; then
            echo "::error::Private slide delivery requires the ORG_REPO_ADMIN_TOKEN Actions secret."
            exit 1
          fi
          paths=()
          while IFS= read -r filename; do
            paths+=("$filename")
          done < <(gh api --paginate "/repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [[ "${#paths[@]}" -ne 1 || ! "${paths[0]}" =~ ^_talks/(fall-2026-[0-9]{2})\.md$ ]]; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Slide mode choice ignored: the title PR must change exactly one assigned talk file."
            exit 1
          fi
          record_id="${BASH_REMATCH[1]}"
          decision="$(python scripts/submission_registry.py check-pr --token-env GH_TOKEN --repository "$REPOSITORY" --record-id "$record_id" --submission-type metadata --author-id "$author_id" --author-login "$author_login" --author-type "$author_type" --head-repository "$head_repo")"
          [[ "$(jq -r '.status' <<<"$decision")" == "owner_match" ]] || {
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Slide mode choice rejected: only the registered student may choose the delivery mode."
            exit 1
          }
          current_mode="$(
            awk -F: -v record_id="$record_id" '
              BEGIN { mode = "public" }
              /^[[:space:]]*($|#)/ { next }
              {
                key = $1
                value = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                if (key == record_id) {
                  mode = value ? value : "public"
                }
              }
              END { print mode }
            ' _data/slide_modes.yml 2>/dev/null || echo public
          )"
          if [[ "$current_mode" != "public" && "$current_mode" != "private" ]]; then
            echo "::error::_data/slide_modes.yml has invalid mode '$current_mode' for $record_id."
            exit 1
          fi
          manifest_update_needed=false
          if [[ "$current_mode" != "$mode" ]]; then
            manifest_update_needed=true
          fi
          if [[ "$manifest_update_needed" == true && "$ADMIN_TOKEN_AVAILABLE" != "true" ]]; then
            echo "::error::Changing slide delivery mode requires the ORG_REPO_ADMIN_TOKEN Actions secret."
            exit 1
          fi
          if [[ "$mode" == private ]]; then
            private_repo="stat701/private-slides-$record_id"
            gh repo view "$private_repo" >/dev/null 2>&1 || gh repo create "$private_repo" --private --description "Private STA 701S slides for $record_id" --disable-issues --disable-wiki
            visibility="$(gh repo view "$private_repo" --json visibility --jq '.visibility')"
            if [[ "$visibility" != "PRIVATE" ]]; then
              echo "::error::$private_repo exists but is not private."
              exit 1
            fi
            gh api --method PUT "/repos/$private_repo/collaborators/$author_login" -f permission=push >/dev/null
            tmp="$(mktemp -d)"
            if gh api "/repos/$private_repo/git/ref/heads/main" >/dev/null 2>&1; then
              gh repo clone "$private_repo" "$tmp/repo" -- --branch main --single-branch --depth 1
            else
              mkdir -p "$tmp/repo"
              git -C "$tmp/repo" init -b main
              git -C "$tmp/repo" remote add origin "https://github.com/$private_repo.git"
            fi
            cp -R templates/private-slides/. "$tmp/repo/"
            git -C "$tmp/repo" add .
            git -C "$tmp/repo" diff --cached --quiet || git -C "$tmp/repo" -c user.name='STA 701S bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Initialize private STA 701S slides repository'
            git -C "$tmp/repo" push origin HEAD:main
          fi
          if [[ "$manifest_update_needed" == true ]]; then
            branch="bot/slide-mode-$record_id-${GITHUB_RUN_ID}"
            git fetch origin main
            git switch -C "$branch" origin/main
            python scripts/set_slide_mode.py --record-id "$record_id" --mode "$mode"
            git add _data/slide_modes.yml
            git diff --cached --quiet && {
              echo "Slide delivery mode for $record_id was already $mode after refreshing main."
            } || {
              git config user.name 'STA 701S bot'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "Set $record_id slide delivery mode to $mode"
              git push origin "$branch"
              mode_pr="$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" --title "Set $record_id slides to $mode" --body "Machine-generated delivery-mode update for $record_id.")"
              gh pr merge "$mode_pr" --repo "$REPOSITORY" --squash --admin --delete-branch
            }
          fi
          if [[ "$mode" == public ]]; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Public slides enabled. Submit the PDF through the public STA 701S repository workflow."
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Private slides enabled. Upload the PDF in https://github.com/$private_repo and open a PR for instructor review."
          fi
