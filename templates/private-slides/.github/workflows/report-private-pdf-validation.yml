name: Report private PDF validation

on:
  workflow_run:
    workflows:
      - Validate private slides
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: private-pdf-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Explain private PDF validation to the student
    if: >-
      github.repository_owner == 'stat701' &&
      startsWith(github.event.repository.name, 'private-slides-fall-2026-') &&
      github.event.repository.private == true &&
      github.event.repository.default_branch == 'main' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out only the trusted reporter from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/report_pdf_validation.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Post or update the private PDF diagnostic comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_pdf_validation.py \
            --repository "$REPOSITORY" \
            --run-id "$VALIDATION_RUN_ID" \
            --private
