name: Validate private slides

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: private-slides-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate private slides
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pull request as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: submission
          persist-credentials: false

      - name: Check out the trusted validator from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          repository: ${{ github.event.pull_request.base.repo.full_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils qpdf

      - name: Validate the private slide PDF
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$REPOSITORY_NAME" =~ ^private-slides-(fall-2026-(0[1-9]|1[0-8]))$ ]]; then
            echo "::error::Private slide repositories must be named private-slides-fall-2026-XX."
            exit 1
          fi
          record_id="${BASH_REMATCH[1]}"

          if [[ ! -f trusted/scripts/validate_private_slides.py || ! -f trusted/scripts/validate_slide_pdf.py ]]; then
            echo "::error::The trusted base commit does not contain the private slide validator and shared PDF engine."
            exit 1
          fi

          python trusted/scripts/validate_private_slides.py \
            --repo submission \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --record-id "$record_id" \
            --report "$RUNNER_TEMP/pdf-validation/report.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check for PDF diagnostics
        id: report
        if: ${{ always() }}
        env:
          REPORT_PATH: ${{ runner.temp }}/pdf-validation/report.json
        shell: bash
        run: |
          if [[ -f "$REPORT_PATH" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the private PDF validation report
        if: ${{ always() && steps.report.outputs.exists == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pdf-validation-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pdf-validation/report.json
          if-no-files-found: error
          retention-days: 3
